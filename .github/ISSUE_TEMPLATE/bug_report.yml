name: 🐛 Bug report
description: Something in PalPocket isn't working right
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PalPocket! Fill in what you can — even a quick note helps.
  - type: input
    id: version
    attributes:
      label: PalPocket version
      description: You'll find it at the bottom of ⚙️ Settings (e.g. 3.5.0).
      placeholder: "3.5.0"
    validations:
      required: false
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - PalPocket (normal)
        - PalPocket Beta
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: false
